services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wiseplay_app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: wiseplay_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wiseplay_php
      MYSQL_USER: wiseplay_user
      MYSQL_PASSWORD: wiseplay_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: wiseplay_phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: wiseplay_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  mysql_data:
